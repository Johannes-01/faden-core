name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        # Integration tests (FADEN_INTEGRATION=1) need the Keychain and the speech models; they run locally.
        run: scripts/test.sh
